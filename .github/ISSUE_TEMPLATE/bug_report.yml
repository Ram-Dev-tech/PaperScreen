name: 🐛 Report a Problem
description: Create a report to help us improve PaperScreen
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the problem?
    validations:
      required: true
  - type: input
    id: paperscreen-version
    attributes:
      label: PaperScreen version
      description: Which version of PaperScreen are you using?
  - type: input
    id: android-version
    attributes:
      label: Android version
      description: E.g., Android 15
  - type: input
    id: device
    attributes:
      label: Device
      description: E.g., Google Pixel 8
